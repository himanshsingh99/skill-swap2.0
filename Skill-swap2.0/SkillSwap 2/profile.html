<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My profile | SkillSwap</title><link rel="stylesheet" href="style.css"><script type="module" src="js/profile.js"></script></head>
<body><header class="topbar"><a class="brand" href="index.html">Skill<span>Swap</span></a><nav><a href="index.html">Discover</a><a class="active" href="profile.html">My profile</a><a href="requests.html">Requests</a></nav><div class="nav-actions"><span id="nav-user" class="muted"></span><a class="button small" id="auth-link" href="login.html">Login</a><button id="logout-btn" class="button small secondary hidden">Logout</button></div></header>
<main class="page-wrap"><a class="back-link" href="index.html">← Back to discovery</a><section class="form-card"><p class="eyebrow">YOUR STUDENT CARD</p><h1>Build your skill profile</h1><p class="muted">Tell other students what you can teach and what you want to learn.</p><div id="page-message" class="notice hidden"></div>
<form id="profile-form" class="hidden"><div class="form-grid"><div class="field"><label for="name">Full name</label><input id="name" required maxlength="80" placeholder="Your name"></div><div class="field"><label for="course">Course / college</label><input id="course" maxlength="120" placeholder="e.g. BCA, 2nd year"></div></div>
<div class="field"><label for="bio">Short introduction</label><textarea id="bio" maxlength="500" placeholder="A little about you and your interests…"></textarea></div>
<div class="field"><label for="teach">Skills I can teach</label><input id="teach" maxlength="500" placeholder="HTML, C++, Canva (comma-separated)"><small>Separate skills with commas.</small></div>
<div class="field"><label for="learn">Skills I want to learn</label><input id="learn" maxlength="500" placeholder="Python, UI design (comma-separated)"></div>
<div class="form-actions"><button type="submit" class="button">Save profile</button><a href="index.html" class="button secondary">Browse students</a></div></form></section></main><footer>SkillSwap · Your knowledge can help someone</footer></body></html>
